name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 git make
          python3 --version

      - name: ounce-devkit (libounce)
        run: |
          git clone --depth 1 https://github.com/ouncebrew/ounce-devkit /tmp/ounce-devkit
          cd /tmp/ounce-devkit
          # pkg.devkitpro.org answers GitHub's runners with 403 at times. The image already has devkitPro's packages, so when
          # install.sh fails at that, the [ounce] packages are installed with a configuration that has only [ounce] in it.
          if ! sh install.sh; then
            conf=/opt/devkitpro/pacman/etc/pacman.conf
            awk '/^\[/{keep = ($0 !~ /^\[dkp-/)} keep || !/^\[|^Server|^Include/' "$conf" > /tmp/ounce-only.conf
            cat /tmp/ounce-only.conf
            set -f
            ow="--overwrite /opt/devkitpro/libounce/* --overwrite /opt/devkitpro/portlibs/switch2/* --overwrite /opt/devkitpro/switch2vars.sh"
            dkp-pacman --config /tmp/ounce-only.conf -Sy --needed --noconfirm $ow libounce ouncevk libkaihen \
              || dkp-pacman --config /tmp/ounce-only.conf -Sydd --needed --noconfirm $ow libounce ouncevk libkaihen
            set +f
          fi
          ls "$DEVKITPRO/libounce"

      - name: Loader (ns2LOAD-game.nro)
        working-directory: loader
        run: python3 tools/build_loader.py

      - name: Menu (ns2LOAD.nro)
        working-directory: menu
        run: make

      - name: Card layout
        run: |
          mkdir -p card/switch/ns2LOAD card/ns2LOAD/games
          cp loader/out/ns2LOAD-game.nro menu/out/ns2LOAD.nro card/switch/ns2LOAD/

      - uses: actions/upload-artifact@v4
        with:
          name: ns2LOAD-sd-card
          path: card/
